<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" role="img" aria-label="ChemX Direct product drum placeholder">
  <!-- Placeholder standing in for the real product photo (images/product-drum.png) -->
  <defs>
    <linearGradient id="drumBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9edef"/>
      <stop offset="0.18" stop-color="#fafbfb"/>
      <stop offset="0.5" stop-color="#f1f4f5"/>
      <stop offset="0.85" stop-color="#e2e7e9"/>
      <stop offset="1" stop-color="#d5dbde"/>
    </linearGradient>
  </defs>

  <!-- body -->
  <path d="M100 80 C100 58 167 46 250 46 C333 46 400 58 400 80 L400 480 C400 502 333 514 250 514 C167 514 100 502 100 480 Z" fill="url(#drumBody)"/>
  <!-- top lid -->
  <ellipse cx="250" cy="80" rx="150" ry="32" fill="#ffffff"/>
  <ellipse cx="250" cy="80" rx="150" ry="32" fill="none" stroke="#e2e5e7" stroke-width="2"/>
  <!-- bungs -->
  <ellipse cx="185" cy="70" rx="22" ry="9" fill="#f4f6f7" stroke="#e2e5e7" stroke-width="2"/>
  <ellipse cx="315" cy="70" rx="22" ry="9" fill="#f4f6f7" stroke="#e2e5e7" stroke-width="2"/>
  <!-- ribs -->
  <path d="M101 170 C120 186 180 194 250 194 C320 194 380 186 399 170" fill="none" stroke="#d5dbde" stroke-width="10" stroke-linecap="round"/>
  <path d="M101 350 C120 366 180 374 250 374 C320 374 380 366 399 350" fill="none" stroke="#d5dbde" stroke-width="10" stroke-linecap="round"/>
  <!-- wordmark -->
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="128" y="290" font-size="64" font-weight="700" fill="#162229">Chem</text>
    <text x="300" y="292" font-size="78" font-weight="800" fill="#2A93D3">X</text>
    <text x="352" y="288" font-size="20" font-weight="600" letter-spacing="2" fill="#162229">DIRECT</text>
  </g>
</svg>
